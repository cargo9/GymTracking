<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер тренировок</title>
    <link rel="stylesheet" href="src/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page">
    <div class="shell">

      <input type="checkbox" id="menu-toggle" class="visually-hidden">
      <input type="checkbox" id="settings-toggle" class="visually-hidden">

      <div class="topbar">
        <label for="menu-toggle" class="icon-btn" tabindex="0">
          <span class="burger-line burger-line-1"></span>
          <span class="burger-line burger-line-2"></span>
          <span class="burger-line burger-line-3"></span>
        </label>
        <span class="topbar-title" data-i18n="appTitle"></span>
      </div>

      <div id="drawer" class="drawer">
        <div class="card drawer-card">
          <div class="drawer-header">
            <h3 id="calendar-title" class="heading-font"></h3>
            <span id="calendar-sessions" class="accent-label"></span>
          </div>
          <div id="calendar-weekdays" class="calendar-weekdays"></div>
          <div id="calendar-grid" class="calendar-grid"></div>
          <div class="calendar-legend">
            <span class="legend-item"><span class="legend-dot legend-dot-strength"></span><span data-i18n="legendStrength"></span></span>
            <span class="legend-item"><span class="legend-dot legend-dot-cardio"></span><span data-i18n="legendCardio"></span></span>
          </div>
          <label for="settings-toggle" class="settings-open-btn" tabindex="0">
            <span data-i18n="settingsBtn"></span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c67139" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </label>
        </div>
      </div>

      <div id="settings-modal" class="settings-modal">
        <label for="settings-toggle" class="settings-backdrop"></label>
        <div class="settings-sheet">
          <div class="settings-head">
            <h3 data-i18n="settingsTitle"></h3>
            <label for="settings-toggle" class="icon-btn icon-btn-sm" tabindex="0">✕</label>
          </div>
          <div class="settings-rows">
            <div class="settings-row">
              <span data-i18n="settingsLanguage"></span>
              <div class="mini-toggle" id="lang-toggle">
                <button type="button" class="mini-toggle-btn" data-lang="en">EN</button>
                <button type="button" class="mini-toggle-btn" data-lang="ru">RU</button>
              </div>
            </div>
            <div class="settings-row">
              <span data-i18n="settingsUnits"></span>
              <div class="mini-toggle" id="unit-toggle">
                <button type="button" class="mini-toggle-btn" data-unit="kg">kg</button>
                <button type="button" class="mini-toggle-btn" data-unit="lb">lb</button>
              </div>
            </div>
            <div class="settings-row">
              <span data-i18n="settingsDefaultRest"></span>
              <div class="stepper">
                <button type="button" id="rest-default-minus" class="stepper-btn">−</button>
                <span id="rest-default-value" class="stepper-value"></span>
                <button type="button" id="rest-default-plus" class="stepper-btn">+</button>
              </div>
            </div>
            <div class="settings-row">
              <span data-i18n="settingsSound"></span>
              <label class="switch">
                <input type="checkbox" id="sound-toggle">
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </label>
            </div>
            <div class="settings-row settings-row-last">
              <span data-i18n="settingsDarkTheme"></span>
              <label class="switch switch-disabled" data-i18n-title="settingsDarkThemeHint">
                <input type="checkbox" checked disabled>
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="content">

        <header class="page-header">
          <span class="eyebrow" id="today-label"></span>
          <h1 class="heading-font title" data-i18n="heroTitle"></h1>
        </header>

        <section class="stats-grid">
          <div class="stat-card">
            <span class="stat-value heading-font" id="stat-streak">0</span>
            <span class="stat-label" data-i18n="statStreak"></span>
          </div>
          <div class="stat-card">
            <span class="stat-value heading-font" id="stat-volume">0</span>
            <span class="stat-label" data-i18n="statVolume"></span>
          </div>
          <div class="stat-card">
            <span class="stat-value heading-font" id="stat-duration">—</span>
            <span class="stat-label" data-i18n="statDuration"></span>
          </div>
        </section>

        <div class="mode-switch-wrap">
          <input type="radio" name="mode" id="mode-strength" class="visually-hidden" checked>
          <input type="radio" name="mode" id="mode-cardio" class="visually-hidden">

          <div class="mode-shell">
            <label for="mode-strength" class="mode-opt mode-strength" tabindex="0" data-i18n="modeStrength"></label>
            <label for="mode-cardio" class="mode-opt mode-cardio" tabindex="0" data-i18n="modeCardio"></label>
          </div>

          <section class="card form-card form-strength">
            <div class="field">
              <label for="exercise-name" data-i18n="fieldExercise"></label>
              <input id="exercise-name" type="text" class="input" data-i18n-placeholder="fieldExercisePlaceholder">
            </div>

            <div class="field-grid-3">
              <div class="field">
                <label for="weight" id="weight-label"></label>
                <input id="weight" type="number" inputmode="decimal" min="0" step="0.5" class="input input-center" data-i18n-placeholder="fieldWeightPlaceholder">
              </div>
              <div class="field">
                <label for="reps" data-i18n="fieldReps"></label>
                <input id="reps" type="number" inputmode="numeric" min="0" step="1" class="input input-center" data-i18n-placeholder="fieldRepsPlaceholder">
              </div>
              <div class="field">
                <label for="rest" data-i18n="fieldRest"></label>
                <input id="rest" type="number" inputmode="numeric" min="0" step="5" class="input input-center" data-i18n-placeholder="fieldRestPlaceholder">
              </div>
            </div>

            <button id="add-set" type="button" class="btn btn-primary" data-i18n="btnAddSet"></button>
          </section>

          <section class="card form-card form-cardio">
            <div class="field">
              <label for="cardio-minutes" data-i18n="fieldCardio"></label>
              <input id="cardio-minutes" type="number" inputmode="numeric" min="0" step="1" class="input input-center" data-i18n-placeholder="fieldCardioPlaceholder">
            </div>
            <button id="add-cardio" type="button" class="btn btn-primary" data-i18n="btnAddCardio"></button>
          </section>
        </div>

        <section class="timer-section">
          <h2 class="heading-font section-title" data-i18n="timerTitle"></h2>
          <div class="card timer-card">
            <div class="timer-ring" id="timer-ring">
              <div class="timer-ring-inner">
                <span id="timer-time" class="heading-font">—:—</span>
              </div>
            </div>
            <div class="timer-info">
              <span id="timer-label" class="timer-label" data-i18n="timerIdleLabel"></span>
              <span id="timer-sublabel" class="timer-sublabel" data-i18n="timerIdleSublabel"></span>
            </div>
            <button type="button" id="timer-reset" class="timer-reset-btn" data-i18n-title="timerReset">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            </button>
          </div>
        </section>

        <section class="today-section">
          <h2 class="heading-font section-title" data-i18n="todayTitle"></h2>
          <div id="workout-list" class="workout-list"></div>
        </section>

        <section class="week-section">
          <h2 class="heading-font section-title" data-i18n="weekTitle"></h2>
          <div id="week-chart" class="week-chart"></div>
        </section>

        <section class="pr-section">
          <h2 class="heading-font section-title" data-i18n="prTitle"></h2>
          <div id="pr-list" class="pr-list"></div>
        </section>

      </div>
    </div>
  </div>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
